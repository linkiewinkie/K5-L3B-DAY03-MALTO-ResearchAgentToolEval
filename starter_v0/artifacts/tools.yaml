# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team tools ----------------
  - name: dedupe
    description: "Loại bỏ item trùng lặp (cùng URL hoặc cùng tiêu đề) khỏi danh sách kết quả ĐÃ CÓ từ lookup/social_search. Dùng khi gộp nhiều nguồn trước khi format. KHÔNG dùng để tìm kiếm hay đọc nội dung mới; không dùng khi chưa có danh sách item."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã có (mỗi item là object có url/title)"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        key: {type: string, enum: [url, title], default: "url", description: "Trường dùng để so trùng; mặc định url"}
        limit: {type: integer, default: 0, description: "Giữ tối đa N item; 0 là không giới hạn"}
      required: [items]

  - name: filter_results
    description: "Lọc danh sách item ĐÃ CÓ: chỉ giữ item từ các nguồn người dùng chọn (ví dụ Reuters, TechCrunch) và/hoặc chỉ giữ item đăng trong N ngày gần đây. Dùng khi người dùng nói 'chỉ lấy tin từ ...', 'trong 7 ngày gần đây', 'loại bỏ tin cũ'. KHÔNG dùng để tìm kiếm mới (dùng lookup/social_search; lookup đã có timeframe riêng khi tìm) và không dùng khi chưa có danh sách item. Khi đặt days, item không có ngày hợp lệ sẽ bị loại."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã có (object có thể chứa title, url, source, date)"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              date: {type: string}
        sources:
          type: array
          default: []
          description: "Tên nguồn cần giữ, không phân biệt hoa thường, ví dụ Reuters, TechCrunch hoặc reuters.com. Để trống = không lọc theo nguồn"
          items: {type: string}
        days: {type: integer, default: 0, description: "Chỉ giữ item trong N ngày gần đây (7 = một tuần); 0 là không lọc theo ngày"}
      required: [items]

  - name: topic_stats
    description: "Phân tích chủ đề nổi bật trong một danh sách bài viết ĐÃ CÓ: trả về các chủ đề được nhắc nhiều nhất, số bài liên quan, tỉ lệ và các nguồn tiêu biểu. Dùng khi người dùng hỏi 'chủ đề nào được nhắc nhiều nhất', 'thống kê chủ đề' thay vì đọc từng bài. Có thể truyền topics để đếm đúng các chủ đề người dùng nêu. KHÔNG dùng để tóm tắt nội dung từng bài, không dùng để tìm kiếm mới và không dùng khi chưa có danh sách bài."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách bài viết đã có (object có title và/hoặc summary, source hoặc url)"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        top_n: {type: integer, default: 10, description: "Số chủ đề trả về tối đa ở chế độ tự động"}
        min_articles: {type: integer, default: 2, description: "Chủ đề phải xuất hiện trong ít nhất N bài mới được tính (chế độ tự động)"}
        topics:
          type: array
          default: []
          description: "Tuỳ chọn: danh sách chủ đề cụ thể cần đếm, ví dụ agent, regulation. Để trống = tự tìm chủ đề nổi bật"
          items: {type: string}
      required: [items]

  - name: reading_list
    description: "Danh sách bài đọc sau của người dùng, lưu trong file local. action=add lưu một bài (cần url, có thể kèm title và note), list xem toàn bộ, remove xoá một bài theo url, clear xoá sạch. Dùng khi người dùng nói 'lưu bài này để đọc sau', 'cho xem danh sách đọc lại', 'bỏ bài này khỏi danh sách'. KHÔNG dùng để đọc nội dung bài (dùng fetch) hay tìm bài mới. action=clear xoá hết nên PHẢI hỏi xác nhận người dùng trước, chỉ gọi với confirmed=true sau khi người dùng đồng ý."
    parameters:
      type: object
      properties:
        action: {type: string, enum: [add, list, remove, clear], default: "list", description: "add = lưu bài; list = xem danh sách; remove = xoá một bài; clear = xoá tất cả (cần confirmed=true)"}
        url: {type: string, default: "", description: "Địa chỉ bài viết (http/https). Bắt buộc với add và remove"}
        title: {type: string, default: "", description: "Tiêu đề bài viết (tuỳ chọn, dùng với add)"}
        note: {type: string, default: "", description: "Ghi chú của người dùng (tuỳ chọn, dùng với add)"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true khi người dùng đã đồng ý rõ ràng việc xoá toàn bộ (action=clear)"}
      required: [action]
